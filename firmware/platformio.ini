; CommandAGI SO-101 robot-arm firmware — pair over BLE, self-register under your account, drive the
; 6x Feetech STS3215 servo bus from cloud /control actions. NO laptop.
;
; Target: AI-Thinker ESP32-CAM (ESP32 + 4MB flash + PSRAM) — the arm is built on an ESP32-CAM module
; so it can later stream its own POV (see the TODO in main.cpp). The servo bus uses UART2 remapped to
; the exposed, boot-safe GPIO13/14 (GPIO16/17 are PSRAM on this module). Pins live in src/config.h.
;
; Build/flash:  pio run -t upload && pio device monitor   (from this firmware/ directory)
; The board flashes over USB-UART. We deliberately do NOT enable Secure Boot or Flash Encryption, and
; the partition table keeps two OTA app slots, so the firmware can ALWAYS be re-flashed over USB or
; updated over-the-air later (see partitions.csv).
;
; PlatformIO + Python 3.14 gotcha: unpinned `platform = espressif32` resolves to a build whose Arduino
; core fails to install. Keep the platform pinned.

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Dual-OTA, no-Secure-Boot layout — guarantees re-flashability + future OTA. BLE + Wi-Fi + TLS needs
; a big app partition; the default single-app table overflows, so we match the camera's table.
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  bblanchon/ArduinoJson@^7.0.4

build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
